=====================================================================

FUTBOL QUANT OLASILIK VE DEĞER (VALUE) KUPON SİSTEMİ KONFİGÜRASYONU

=====================================================================

veritabani:

Şifre ve bağlantı bilgileri koda veya buraya yazılmaz; ortam değişkenlerinden okunur.

env_host: "DB_HOST"
env_user: "DB_USER"
env_password: "DB_PASSWORD"
env_name: "DB_NAME"
env_port: "DB_PORT"
varsayilan_port: 3306
tablo_fikstur: "fikstur"
tablo_tahminler: "tahminler"
tablo_oranlar: "oranlar"

veri_temizlik:
hedef_ligler:
- "ENGLISH-PREMIER-LEAGUE"
- "LALIGA"
- "GERMAN-BUNDESLIGA"
- "ITALIAN-SERIE-A"
- "LIGUE-1"
- "TURKISH-SUPER-LIG"
- "PORTUGUESE-PRIMEIRA-LIGA"
- "BRASILEIRO-SERIE-A"
lig_eslestirme:
SPANISH-LALIGA: "LALIGA"
FRENCH-LIGUE-1: "LIGUE-1"
PRIMEIRA-LIGA: "PORTUGUESE-PRIMEIRA-LIGA"
DUTCH-EREDIVISIE: "EREDIVISIE"
sahte_sifir_kontrolu:
brezilya_komple_bos_kontrol: true
super_lig_pas_bos_kontrol: true
iy_skor_tutarlilik_kontrol: true

ozellik_muhendisligi:
ewm_yari_omur_mac: 5.5          # Üstel ağırlıklı ortalama yarı ömrü (~5-6 maç)
empirical_bayes_shrinkage_k: 8.0 # Lig ortalamasına çekme (shrinkage) sabiti
saha_shrinkage_k: 5.0           # Ev/Deplasman vs Genel form karışım sabiti
sezon_gecisi_reversion: 0.65    # Sezon başında eski reytingi koruma oranı (%35 merkeze çekilir)
elo:
baslangic_puani: 1500.0
k_faktoru: 20.0
ev_avantaji_elo: 55.0
dinlenme_gunu:
min_gun: 2.0
max_gun: 14.0
varsayilan_gun: 7.0
form_penceresi_mac: 5

modeller:
dixon_coles:
max_gol_matrisi: 9
max_iy_gol_matrisi: 5
max_2y_gol_matrisi: 6
baslangic_rho: -0.09
lambda_alt_sinir: 0.20
lambda_ust_sinir: 4.20
ridge_alpha: 25.0
yapisal_agirlik: 0.55         # 0.55 * DC_yapısal + 0.45 * Ridge_regresyon
negatif_binom:
korner_ridge_alpha: 30.0
kart_ridge_alpha: 30.0
varsayilan_alpha_korner: 0.08
varsayilan_alpha_kart: 0.14
karsilastirma_ml:
lojistik_regresyon_c: 0.20
lightgbm:
aktif: true
min_egitim_orneklemi: 250
n_estimators: 60
max_depth: 3
num_leaves: 7
learning_rate: 0.04
min_child_samples: 35
subsample: 0.80
colsample_bytree: 0.80
random_state: 42

backtest_ve_market_secimi:
walk_forward:
isinma_orani: 0.25            # İlk %25 warm-up
validasyon_bitis_orani: 0.80  # %25 - %80 validasyon (OOF kalibrasyon ve market seçimi)
holdout_test_orani: 0.20      # Son %20 hiç dokunulmayan out-of-sample test seti
yeniden_egitim_sikligi: "W"   # Haftalık genişleyen pencere (expanding window)
kabul_kriterleri:
min_orneklem_sayisi: 300
bootstrap_iterasyon: 1000
guven_duzeyi: 0.95
sart_ci_alt_sinir_pozitif: true # %95 güven aralığı 0'ı kapsıyorsa market KAPALI
max_ece_esigi: 0.045
cikti_dosyasi: "marketler.json"

kalibrasyon:
min_isotonic_orneklem: 400      # >= 400 ise Isotonic, < 400 ise Platt (Logit) Scaling
olasilik_alt_sinir: 0.01
olasilik_ust_sinir: 0.99
yumusatma_agirligi: 0.85        # 0.85 * p_kalibre + 0.15 * p_ham (sıçrama önleyici)
canli_izleme:
rolling_pencere_tahmin: 100
min_canli_orneklem: 20
otomatik_devre_disi_birak: true

deger_ve_kupon:
marj_arindirma_yontemi: "shin"  # "shin" veya "orantili"
min_edge: 0.045                 # Minimum %4.5 beklenen değer avantajı (edge)
min_takim_gecmis_mac: 5         # Sezon başı <5 maçı olan takımlara bahis alınmaz
kupon_kurallari:
gunluk_max_kupon: 1
hedef_min_toplam_oran: 4.00
max_toplam_oran: 12.00
min_bacak_sayisi: 2
max_bacak_sayisi: 4
min_kupon_ev: 0.08
ayni_mactan_max_bacak: 2      # 2 bacak varsa ortak olasılık skor matrisinden hesaplanır
oran_yoksa_mod: "ADIL_ORAN"   # "ADIL_ORAN" (1/p) modunda oran uydurmaz, gerçek oran ister
risk_yonetimi:
kelly_kesri: 0.25             # 1/4 Fractional Kelly
max_kupon_stake_yuzde: 0.02   # Bankroll'ün en fazla %2'si
gunluk_max_zarar_yuzde: 0.04  # Günlük %4 bankroll kaybında durdur
haftalik_max_zarar_yuzde: 0.08 # Haftalık %8 bankroll kaybında durdur
