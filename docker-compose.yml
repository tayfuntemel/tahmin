version: "3.9"services:
quant-gunluk-motor:
image: python:3.11-slim
container_name: netscout_quant_engine
working_dir: /app
volumes:
- ./:/app
environment:
- TZ=Europe/Istanbul
- DB_HOST=${DB_HOST}
- DB_USER=${DB_USER}
- DB_PASSWORD=${DB_PASSWORD}
- DB_NAME=${DB_NAME}
- DB_PORT=${DB_PORT:-3306}
command: >
sh -c "pip install --no-cache-dir numpy pandas scipy scikit-learn lightgbm pymysql requests pyyaml &&
python3 guncelle.py &&
python3 cek_2.py &&
python3 gunluk_calistir.py"
restart: "no"quant-haftalik-kalibrasyon:
image: python:3.11-slim
container_name: netscout_quant_retrainer
working_dir: /app
volumes:
- ./:/app
environment:
- TZ=Europe/Istanbul
- DB_HOST=${DB_HOST}
- DB_USER=${DB_USER}
- DB_PASSWORD=${DB_PASSWORD}
- DB_NAME=${DB_NAME}
- DB_PORT=${DB_PORT:-3306}
command: >
sh -c "pip install --no-cache-dir numpy pandas scipy scikit-learn lightgbm pymysql requests pyyaml &&
python3 -c 'from gunluk_calistir import ana_akis; ana_akis(haftalik_yeniden_egit=True)'"
restart: "no"
profiles:
- retrain
