name: Futbol Quant Günlük Kupon ve Kalibrasyon Pipeline

on:
schedule:
# Her gün Türkiye saati ile 11:00'de (UTC 08:00) çalışır
- cron: "0 8 * * *"
# Her Pazartesi Türkiye saati ile 06:00'da (UTC 03:00) haftalık walk-forward yeniden eğitim
- cron: "0 3 * * 1"
workflow_dispatch:
inputs:
haftalik_egitim_zorla:
description: "Walk-Forward Backtest ve Kalibrasyonu Baştan Çalıştır"
required: false
default: "false"
type: choice
options:
- "false"
- "true"

jobs:
quant-pipeline:
runs-on: ubuntu-latest
timeout-minutes: 30

env:
  TZ: "Europe/Istanbul"
  DB_HOST: ${{ secrets.DB_HOST }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_PORT: ${{ secrets.DB_PORT }}

steps:
  - name: Depoyu Klonla
    uses: actions/checkout@v4

  - name: Python 3.11 Kurulumu
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: "pip"

  - name: Kütüphaneleri Yükle
    run: |
      python -m pip install --upgrade pip
      pip install numpy pandas scipy scikit-learn lightgbm pymysql requests pyyaml

  - name: 1. Geçmiş Maçları ve Tahmin Sonuçlarını Güncelle (guncelle.py)
    run: python guncelle.py

  - name: 2. Gelecek 3 Günün Fikstürünü Çek (cek_2.py)
    run: python cek_2.py

  - name: 3. Quant Model, Drift Kontrolü ve Günlük Kupon Üretimi (gunluk_calistir.py)
    run: |
      if [ "${{ github.event.schedule }}" = "0 3 * * 1" ] \vert{}\vert{} [ "${{ github.event.inputs.haftalik_egitim_zorla }}" = "true" ]; then
        echo "Haftalık Walk-Forward yeniden eğitim ve kalibrasyon başlatılıyor..."
        python -c "from gunluk_calistir import ana_akis; ana_akis(haftalik_yeniden_egit=True)"
      else
        echo "Günlük kupon ve canlı drift kontrolü çalıştırılıyor..."
        python gunluk_calistir.py
      fi

  - name: Marketler ve Kalibrasyon Çıktısını Kaydet
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: quant-marketler-raporu
      path: |
        marketler.json
      retention-days: 14
