name: "Quant Gunluk Kupon Pipeline"

on:
  schedule:
    - cron: "30 6 * * *" # TSİ 09:30'da otomatik tetiklenir
  workflow_dispatch:     # Manuel "Run workflow" butonu için şart

jobs:
  kupon_olustur:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pymysql pandas numpy scipy scikit-learn lightgbm

      - name: 1. Adım - Maçları Sonuçlandır (guncelle.py)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python guncelle.py

      - name: 2. Adım - Yeni Fikstürü Çek (cek_2.py)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python cek_2.py

      - name: 3. Adım - Özellikleri Çıkar, Modeli Kur ve Kuponu DB'ye Yaz
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python gunluk_calistir.py

      # (Opsiyonel) Backtest sırasında değişen marketler.json dosyasını repoya geri kaydetmek için
      - name: marketler.json güncellemelerini repoya kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add marketler.json
          git commit -m "chore: marketler.json otomatik güncellendi" || echo "Değişiklik yok"
          git push
